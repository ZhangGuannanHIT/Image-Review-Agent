# 单图推理配置。正式审核仍以 backend/config.yaml 为启动入口。
# src/cli.py 默认读取本文件，命令行参数可逐项覆盖。
model_path: "fg_clip"
ckpt_dir: "checkpoints/best"
device: "cuda"
lora: true
strict_load: true

# 多标签阈值已在验证集（292 条）上标定，见 eval_results/threshold_calibration.json。
# 注意：验证集样本有限，阈值是"当前最优"，标注扩充后应重新标定。
type_thresholds:
  "无暴力": 0.45
  "直接暴力（攻击进行中）": 0.6
  "后果展示（尸体/伤口）": 0.6
  "暗示/威胁（武器指向/捆绑）": 0.9

# quality 与 violence_type 一样按多标签解码（"严重模糊 + 文字扭曲形变"可同时命中）。
# 键必须覆盖 src/labels.py 的全部类别，tests/test_inference_config.py 会校验。
quality_thresholds:
  "清晰": 0.35
  "轻微模糊": 0.3
  "严重模糊": 0.55
  # 召回优先：F1 最优阈值是 0.7（召回仅 40%），这里取 0.25（验证集召回 87%），
  # 由下游 Agent/人工复核过滤误报。项目重点就是文字扭曲这类隐性违规。
  "文字扭曲形变": 0.25
  # 验证集仅 3 个正样本，未标定，保持 0.5；当前该类别基本不可用。
  "故意遮挡（马赛克/黑条/贴纸）": 0.5
