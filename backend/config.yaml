# 后端运行配置。OCR 与裁决 LLM 的模型信息分别放在独立配置文件中。
# ★ 敏感信息（api_key）勿提交仓库，实际使用环境变量覆盖。

server:
  host: "0.0.0.0"
  port: 8000
  max_image_mb: 10

runtime:
  mode: "real"          # 使用 2026-10-18 导入的 LoRA 与分类头

ocr_config_path: "config/ocr.yaml"
llm_config_path: "config/llm.yaml"
inference_config_path: "config/inference.yaml"  # 本轮训练标定的多标签阈值

model:
  path: "fg_clip"
  ckpt_dir: "checkpoints/best"
  device: "cuda"
  lora: true                 # 加载训练后的视觉 LoRA adapter
  require_checkpoint: true   # 必须同时加载 LoRA adapter 与分类头

features:
  ocr_enabled: true
  lowlevel_enabled: true
  rag_enabled: false          # RAG 尚未实现，本轮不注册该工具

# ReAct agent 配置（LLM 为核心）
agent:
  max_rounds: 5
  on_tool_fail: "skip"   # 可选工具失败: skip | abort

log_dir: "backend/logs"

# 血腥单头的临时业务门槛，未重新标定；风险保留 argmax，类型使用 inference.yaml。
decision_policy:
  min_injury_confidence: 0.75
  min_injury_margin: 0.20
audit:
  save_images: true

vision_review:
  enabled: true
  trigger:
    max_confidence: 0.65
    min_margin: 0.20

