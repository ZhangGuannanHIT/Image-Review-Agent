# 后端运行配置。OCR 与裁决 LLM 的模型信息分别放在独立配置文件中。
# ★ 敏感信息（api_key）勿提交仓库，实际使用环境变量覆盖。

server:
  host: "0.0.0.0"
  port: 8000
  max_image_mb: 10

runtime:
  mode: "mock"          # 默认安全演示；正式审核需配置完整依赖后切换 real

ocr_config_path: "config/ocr.yaml"
llm_config_path: "config/llm.yaml"

model:
  path: "fg_clip"
  ckpt_dir: "checkpoints/best"
  device: "cuda"
  lora: true
  require_checkpoint: true   # real 模式禁止随机分类头给出审核结论

features:
  ocr_enabled: true
  lowlevel_enabled: true
  rag_enabled: true           # 启用本地规则与判例检索

# ReAct agent 配置（LLM 为核心）
agent:
  max_rounds: 5
  on_tool_fail: "skip"   # 可选工具失败: skip | abort

log_dir: "backend/logs"

