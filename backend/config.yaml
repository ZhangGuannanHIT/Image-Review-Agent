# 后端运行配置。OCR 与裁决 LLM 的模型信息分别放在独立配置文件中。
# ★ 敏感信息（api_key）勿提交仓库，实际使用环境变量覆盖。

server:
  host: "0.0.0.0"
  port: 8000
  max_image_mb: 10

runtime:
  mode: "real"          # 使用 2026-10-18 导入的 LoRA 与分类头

ocr_config_path: "config/ocr.yaml"
llm_config_path: "config/llm.yaml"
inference_config_path: "config/inference.yaml"  # 本轮训练标定的多标签阈值

model:
  path: "fg_clip"
  ckpt_dir: "checkpoints/best"
  device: "cuda"
  lora: true                 # 加载训练后的视觉 LoRA adapter
  require_checkpoint: true   # 必须同时加载 LoRA adapter 与分类头
  binary_injury_dir: "checkpoints/best/injury_binary"
  quality_fusion_dir: "checkpoints/best/quality_fusion"
  anime_style_router_dir: "checkpoints/anime_style_router"
  anime_style_min_score: 0.90

features:
  ocr_enabled: true
  lowlevel_enabled: true
  rag_enabled: true           # 启用本地规则与案例检索，无额外服务依赖
  scene_concepts_enabled: true # 仅风险非 L0 时由固定工作流调用
  llm_explanation_enabled: true
  # selective: 仅指定动作调用 LLM，其他动作使用固定程序模板。
  llm_explanation_mode: "selective"
  llm_explanation_actions: ["review", "block"]

scene_concepts:
  config_path: "config/scene_concepts.yaml"

# Fixed conditional evidence workflow. No LLM controller or tool-selection loop.
workflow:
  type: "fixed_evidence"

text_detection:
  # opencv_light is dependency-free and high-recall. rapidocr needs a local
  # model/runtime and is recommended when its detection model is available.
  provider: "opencv_light"
  rapidocr_model_dir: ""
  max_side: 1600
  min_line_height: 7
  min_layout_score: 0.48
  min_region_score: 0.52
  min_aligned_glyphs: 2

log_dir: "backend/logs"
history_db: "data/reviews.sqlite3"

# 血腥单头的临时业务门槛，未重新标定；风险保留 argmax，类型使用 inference.yaml。
decision_policy:
  min_injury_confidence: 0.75
  min_injury_margin: 0.20
  binary_clear_margin: 0.05
  real_l1_relax_max_confidence: 0.65
  aggressive_anime_relaxation: true
  risk_x_auto_allow: true
  risk_x_prompt_margin_max: 0.015
  semantic_food_relaxation: true
audit:
  save_images: true

anime_vision_review:
  # High-confidence anime routes or a narrow game-UI weapon candidate can call
  # the image-capable LLM. Failures never withdraw the original action.
  enabled: true
  max_side: 1280
  min_style_score: 0.90
  real_context_enabled: false
  real_context_trigger_threshold: 0.006
  real_context_direct_violence_max: 0.65
  allow_safety_review: true
  max_tokens: 512
  max_retries: 1
  json_response: true

