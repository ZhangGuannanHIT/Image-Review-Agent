# 复制为 config/ocr.yaml 后填写，或使用环境变量 ALIYUN_OCR_APPCODE。
aliyun_market_ocr:
  provider: "aliyun_market_ocr"
  model: "advanced"
  endpoint: "https://gjbsb.market.alicloudapi.com/ocrservice/advanced"
  appcode: ""
  timeout: 60
  max_image_mb: 25
  prob: true
  char_info: false
  rotate: true
  table: false
  sort_page: false
  no_stamp: false
  figure: false
  row: true
  paragraph: false
  oricoord: true

