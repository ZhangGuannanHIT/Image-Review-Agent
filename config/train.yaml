# 训练超参配置（M3 阶段使用；当前占位）
# 训练实际执行需等：标注全部完成 + 图片路径 + 有效 GPU 环境（torch cu128）

model_path: "fg_clip"          # 原始权重目录
device: "cuda"
seed: 42
data:
  json_path: "data/clean/labels.json"   # 由 python -m src.build_dataset 产出的清洗标签文件
  image_root: "data/clean/images"       # 与 labels.json 一一配对的图片目录
  split: [0.85, 0.10, 0.05]    # train / val / test
  stratify_key: "risk"
  split_path: "data/split.json"

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "out_proj"]

optim:
  lr_lora: 1.0e-4
  lr_head: 1.0e-3
  weight_decay: 0.01
  batch_size: 4        # RTX 4060 Laptop 8GB：16 张图同时前向/反向会 OOM
  grad_accum: 4        # 4 × 4 = 16，保持原来的有效 batch
  epochs: 20          # 实际由早停决定
  patience: 5
  amp: true           # fp16

loss:
  label_smoothing: 0.05
  focal_gamma: 0.0    # >0 启用 Focal（仅 risk 头）
  max_weight_clip: 10.0

output_dir: "checkpoints"
eval_dir: "eval_results"
