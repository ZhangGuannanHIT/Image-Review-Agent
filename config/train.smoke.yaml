# 独立工程冒烟配置：阶段性数据可用，产物不可用于正式评估。
# 从仓库根目录运行 python -m src.train --smoke-steps 1。
smoke: true
model_path: "fg_clip"
device: "cuda"
seed: 42

data:
  json_path: ""                 # 阶段性 Label Studio JSON 路径
  image_root: ""                # 对应图片的本地根目录
  split: [0.85, 0.10, 0.05]
  stratify_key: "risk"
  split_path: "data/smoke/split.json"

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "out_proj"]

optim:
  lr_lora: 1.0e-4
  lr_head: 1.0e-3
  weight_decay: 0.01
  batch_size: 1
  grad_accum: 1
  epochs: 1
  patience: 1
  amp: true

loss:
  label_smoothing: 0.05
  focal_gamma: 0.0
  max_weight_clip: 10.0

output_dir: "checkpoints/smoke"
eval_dir: "eval_results/smoke"
