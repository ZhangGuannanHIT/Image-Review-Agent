# 类别常量（与 src/labels.py 对应，供双来源校验）
# 注意：类名需与 Label Studio JSON 存值前缀一致

risk_classes:
  - "L0_安全"
  - "L1_轻微违规"
  - "L2_中度违规"
  - "L3_严重违规"
  - "X_无法判定"

type_classes:
  - "无暴力"
  - "直接暴力（攻击进行中）"
  - "后果展示（尸体/伤口）"
  - "暗示/威胁（武器指向/捆绑）"

injury_classes:
  - "无血腥"
  - "轻微（微量血迹/淤青）"
  - "中度（明显开放性伤口/大量血泊）"
  - "严重（器官/骨骼暴露/分尸）"

quality_classes:
  - "清晰"
  - "轻微模糊"
  - "严重模糊"
  - "文字扭曲形变"
  - "故意遮挡（马赛克/黑条/贴纸）"

# 多任务损失权重
loss_weights:
  risk: 1.0
  type: 0.5
  injury: 0.5
  quality: 0.5
